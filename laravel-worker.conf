[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/property_finder/artisan queue:work database --sleep=3 --tries=3 --timeout=300 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/property_finder/storage/logs/worker.log
stopwaitsecs=3600

